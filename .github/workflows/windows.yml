name: Windows
# 触发规则详解 https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#on
on:
  workflow_dispatch:
  push:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/windows.yml'
      - 'ci/win**'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/windows.yml'
      - 'ci/win**'
jobs:
  build:
    name: Build
    # windows-latest 目前是 Windows Server 2022
    runs-on: windows-2022

    # 只构建 64 位，减少云编译时间
    strategy:
      matrix:
        include:
          - qt-arch: win64_msvc2019_64
            msvc-arch: x64
            qt-arch-install: msvc2019_64
    env:
      target-name: QtScrcpy
      platform-des: win
      qt-ver: '5.15.2'
      qt-install-path: ${{ github.workspace }}/Qt/${{ matrix.qt-ver }}
    steps:
      # 安装 Qt（action 默认装到 workspace/Qt/<ver>/<arch>）
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.qt-ver }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true
      # 拉取代码（子模块已改为 HTTPS，不再依赖 SSH key）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      # 定位 Visual Studio 的 vcvarsall（不写死 VS 安装路径）
      - name: Resolve MSVC environment
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ toolchain not found" }
          "ENV_VCVARSALL=$vsPath\VC\Auxiliary\Build\vcvarsall.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENV_VCINSTALL=$vsPath\VC" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # 编译 msvc
      - name: Build MSVC
        shell: cmd
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
        run: |
          call python ci\generate-version.py
          call "ci\win\build_for_win.bat" RelWithDebInfo ${{ matrix.msvc-arch }}
      # 打包
      - name: Package
        id: package
        shell: pwsh
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}
          publish_name: ${{ env.target-name }}-${{ env.platform-des }}-${{ matrix.msvc-arch }}
        run: |
          cmd.exe /c "ci\win\publish_for_win.bat ${{ matrix.msvc-arch }} ..\build\${{ env.publish_name }}"
          if (-not (Test-Path "ci\build\${{ env.publish_name }}\QtScrcpy.exe")) { throw "package missing QtScrcpy.exe" }
          Compress-Archive -Path "ci\build\${{ env.publish_name }}\*" -DestinationPath "ci\build\${{ env.publish_name }}.zip" -Force
          "package-name=${{ env.publish_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      # 上传 artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package-name }}
          path: ci\build\${{ steps.package.outputs.package-name }}.zip
          if-no-files-found: error
      # tag 时上传到 release
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci\build\${{ steps.package.outputs.package-name }}.zip
          asset_name: ${{ steps.package.outputs.package-name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
